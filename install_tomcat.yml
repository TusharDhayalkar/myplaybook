---
- name: Tomcat install playbook
  hosts: all
  become: true

  tasks:
  - name: Install java Redhat
    yum:
      name: java-17-amazon-corretto
      state: installed
    when: ansible_os_family == "Redhat"

  - name: Install java on Debian
    apt:
      name: default-jdk
      state: present
    when: ansible_os_family == "Debian"

  - name: Download Tomcat Version 11
    get_url:
      url: https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.24/bin/apache-tomcat-11.0.24.tar.gz
      dest: /opt

  - name: Extract Tomcat
    unarchive:
      src: /opt/apache-tomcat-11.0.24.tar.gz
      dest: /opt
      remote_src: yes

  - name: Change shell permission
    file:
      path: /opt/apache-tomcat-11.0.24
      mode: 0777
     
  - name: Run .sh file   
    shell: ./startup.sh
    args:
      chdir: /opt/apache-tomcat-11.0.24/bin



